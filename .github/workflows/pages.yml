name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  poll_submodule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      plugin_latest: ${{ steps.compare.outputs.plugin_latest }}
      lilypond_latest: ${{ steps.compare.outputs.lilypond_latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Compare tool revisions
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          changed=false

          compare_submodule() {
            local output_name="$1"
            local path="$2"
            local label="$3"
            local submodule_url
            local submodule_branch
            local current_sha
            local latest_sha

            submodule_url="$(git config -f .gitmodules --get "submodule.${path}.url")"
            submodule_branch="$(git config -f .gitmodules --get "submodule.${path}.branch")"
            current_sha="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            latest_sha="$(git ls-remote "$submodule_url" "refs/heads/$submodule_branch" | awk '{print $1}')"

            if [[ -z "$current_sha" || -z "$latest_sha" ]]; then
              echo "::error::Could not resolve the current or upstream $label revision"
              exit 1
            fi

            echo "Current $label: $current_sha"
            echo "Latest $label:  $latest_sha"
            echo "${output_name}_latest=$latest_sha" >> "$GITHUB_OUTPUT"

            if [[ "$current_sha" != "$latest_sha" ]]; then
              changed=true
            fi
          }

          compare_submodule plugin tools/plugin-compiler "plugin compiler"
          compare_submodule lilypond tools/lilypond-wasm "LilyPond editor"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: poll_submodule
    if: >-
      always() &&
      (github.event_name != 'schedule' ||
      needs.poll_submodule.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Update tool submodules
        if: github.event_name == 'schedule'
        shell: bash
        env:
          PLUGIN_TARGET_SHA: ${{ needs.poll_submodule.outputs.plugin_latest }}
          LILYPOND_TARGET_SHA: ${{ needs.poll_submodule.outputs.lilypond_latest }}
        run: |
          set -euo pipefail

          update_submodule() {
            local path="$1"
            local target_sha="$2"
            local current_sha
            local submodule_branch

            current_sha="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            submodule_branch="$(git config -f .gitmodules --get "submodule.${path}.branch")"

            if [[ "$current_sha" == "$target_sha" ]]; then
              return
            fi

            git -C "$path" fetch --no-tags origin "$submodule_branch"

            if ! git -C "$path" merge-base --is-ancestor "$current_sha" "$target_sha"; then
              echo "::error::Refusing a non-fast-forward update for $path"
              exit 1
            fi

            git -C "$path" checkout --detach "$target_sha"
            git -C "$path" submodule update --init --recursive
          }

          update_submodule tools/plugin-compiler "$PLUGIN_TARGET_SHA"
          update_submodule tools/lilypond-wasm "$LILYPOND_TARGET_SHA"

          if git diff --quiet -- tools/plugin-compiler tools/lilypond-wasm; then
            echo "::error::The polled revisions did not change a gitlink"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: bun ci

      - name: Test
        run: bun run test

      - name: Build site
        run: bun run build

      - name: Commit tool submodule updates
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/plugin-compiler tools/lilypond-wasm

          staged_paths="$(git diff --cached --name-only)"
          unexpected_paths="$(printf '%s\n' "$staged_paths" | grep -Ev '^(tools/plugin-compiler|tools/lilypond-wasm)$' || true)"

          if [[ -z "$staged_paths" ]]; then
            echo "::error::No submodule updates were staged"
            exit 1
          fi

          if [[ -n "$unexpected_paths" ]]; then
            echo "::error::Unexpected staged paths: $unexpected_paths"
            exit 1
          fi

          git commit -m "chore: update tool submodules" -- \
            tools/plugin-compiler tools/lilypond-wasm
          git push origin HEAD:master

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
